name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }

      # Signs the build if all three secrets exist. If any is missing (new repo,
      # fork, secrets not added yet) it does NOT fail: it warns and builds an
      # unsigned-for-release debug APK so you still get something to test.
      - name: Restore signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SANYA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.SANYA_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SANYA_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::warning title=Signing secrets missing::Building a debug APK only (not signed with your key). Add SANYA_KEYSTORE_B64, SANYA_KEYSTORE_PASSWORD and SANYA_KEY_PASSWORD under Settings > Secrets and variables > Actions to get the properly signed release APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > app/sanya.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        id: tests
        continue-on-error: true   # delete this line once the tests have been green once
        run: gradle testDebugUnitTest

      - name: Say so if the tests failed
        if: steps.tests.outcome == 'failure'
        run: echo "::warning title=Unit tests FAILED::Open the 'Unit tests' step to see which one, or download the test-report artifact. The APK was still built."

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build APKs (signed)
        if: steps.signing.outputs.signed == 'true'
        env:
          SANYA_KEYSTORE_PASSWORD: ${{ secrets.SANYA_KEYSTORE_PASSWORD }}
          SANYA_KEY_PASSWORD: ${{ secrets.SANYA_KEY_PASSWORD }}
          SANYA_KEY_ALIAS: ${{ secrets.SANYA_KEY_ALIAS }}
        run: gradle --continue assembleRelease assembleDebug

      - name: Build APK (debug only, no signing secrets)
        if: steps.signing.outputs.signed != 'true'
        run: gradle assembleDebug

      # Use the release APK. If it ever misbehaves, the debug APK is the fallback
      # (same key when signed, so it installs over the release one without uninstalling).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.signing.outputs.signed == 'true' }}
        with:
          name: Sanya-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Sanya-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
